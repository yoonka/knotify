[package]
name = "oxiport"
version = "1.1.0"
edition = "2024"
license = "BSD-3-Clause"

[dependencies]
anyhow = "1.0"
serde_json = "1"
clap = { version = "4.0", features = ["derive"] }
oxigraph = "0.5.13"
spargeo = { version = "0.5.7", optional = true }

[features]
default = ["geosparql"]
geosparql = ["dep:spargeo"]
